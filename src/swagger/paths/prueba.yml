/api/autor/{id}:
  get:
    tags:
      - Autores
    summary: Obtener autores
    description: Obtener autores
    operationId: ObtenerAutores
    parameters:
      - name: id
        in: path
        description: id autor
        required: true
        schema:
          type: integer
          format: int64
    responses:
      200:
        description: Autores
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Libro"
      400:
        description: Bad Request
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Libro"
      401:
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Libro"
      403:
        description: Forbidden
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Libro"
      500:
        description: Internal Server Error
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Libro"
/api/autor/create:
  post:
    tags:
      - Autor
    summary: Agregar autor
    requestBody:
      description: Agrega un nuevo registro de autor
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Libro"
    responses:
      201:
        description: Autor creado
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Libro"