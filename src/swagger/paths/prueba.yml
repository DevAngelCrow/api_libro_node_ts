/api/autor/{id}:
  get:
    tags:
      - Autores
    summary: Obtener autores
    description: Obtener autores
    operationId: ObtenerAutores
    parameters:
      - name: id
        in: path
        description: id autor
        required: true
        schema:
          type: integer
          format: int64
    responses:
      200:
        description: Autores
        content:
          application/json:
            schema:
              $ref: "#/components"
      400:
        description: Bad Request
        content:
          application/json:
            schema:
              $ref: "./components/schemas/LibroSchema"
      401:
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: "./components/schemas/LibroSchema"
      403:
        description: Forbidden
        content:
          application/json:
            schema:
              $ref: "./components/schemas/LibroSchema"
      500:
        description: Internal Server Error
        content:
          application/json:
            schema:
              $ref: "./components/schemas/LibroSchema"
/api/autor/create:
  post:
    tags:
      - Autor
    summary: Agregar autor
    requestBody:
      description: Agrega un nuevo registro de autor
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              nombre:
                type: string
              apellido:
                type: string
              fecha_publicacion:
                type: string
              id_ingreso:
                type: integer
              edicion:
                type: string
              portada:
                type: string
              id_formato_libro:
                type: integer
              estado:
                type: boolean
              id_idioma:
                type: integer
              resumen:
                type: string
              numero_paginas:
                type: integer
    responses:
      201:
        description: Autor creado
        content:
          application/json:
            schema:
              type: object
              properties:
                nombre:
                  type: string
                apellido:
                  type: string
                fecha_publicacion:
                  type: string
                id_ingreso:
                  type: integer
                edicion:
                  type: string
                portada:
                  type: string
                id_formato_libro:
                  type: integer
                estado:
                  type: boolean
                id_idioma:
                  type: integer
                resumen:
                  type: string
                numero_paginas:
                  type: integer

