openapi: 3.0.0
info:
  title: Swagger API Libro
  version: 1.0.0
  description: Implementación de Swagger con Typescript
  contact:
    name: Angel-dev
servers:
  - url: http://localhost:3000
    description: Local server

paths:
  /api/autor/{id}:
    get:
      tags:
        - Autor
      summary: Obtener autor
      description: Obtener autor
      operationId: ObtenerAutor
      parameters:
        - name: id
          in: path
          description: id autor
          required: true
          schema:
            type: integer
            format: int64
      responses:
        200:
          description: Autores
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Autor"
        400:
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Autor"
        401:
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Autor"
        403:
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Autor"
        500:
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Autor"
  /api/autor/create:
    post:
      tags:
        - Autor
      summary: Agregar autor
      requestBody:
        description: Agrega un nuevo registro de autor
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Autor"
      responses:
        201:
          description: Autor creado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Autor"
        400:
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Autor"
        401:
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Autor"
        403:
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Autor"
        500:
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Autor"
  /api/autor/autores/listado:
    get:
        tags:
          - Autores
        summary: Obtener autores
        description: Obtener autores
        operationId: ObtenerAutores
        responses:
          200:
            description: Autores
            content:
              application/json:
                schema:
                  $ref: "#/components/schemas/Autor"
          400:
            description: Bad Request
            content:
              application/json:
                schema:
                  $ref: "#/components/schemas/Autor"
          401:
            description: Unauthorized
            content:
              application/json:
                schema:
                  $ref: "#/components/schemas/Autor"
          403:
            description: Forbidden
            content:
              application/json:
                schema:
                  $ref: "#/components/schemas/Autor"
          500:
            description: Internal Server Error
            content:
              application/json:
                schema:
                  $ref: "#/components/schemas/Autor"
components:
  schemas:
    Autor:
      type: object
      properties:
        nombres:
          type: string
        apellidos:
          type: string
        fecha_nacimiento:
          type: string
          format: date
        id_nacionalidad:
          type: integer
        telefono:
          type: string
        email:
          type: string
        estado:
          type: boolean
        libros:
          type: array
          items:
            type: integer
        
    Error:
      type: object
      properties:
        message:
          type: string
    Libro:
      type: object
      properties:
        nombre:
          type: string
        apellido:
          type: string
        fecha_publicacion:
          type: string
        id_ingreso:
          type: integer
        edicion:
          type: string
        portada:
          type: string
        id_formato_libro:
          type: integer
        estado:
          type: boolean
        id_idioma:
          type: integer
        resumen:
          type: string
        numero_paginas:
          type: integer
