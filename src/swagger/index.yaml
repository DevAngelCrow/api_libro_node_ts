openapi: 3.0.0
info:
  title: Swagger API Libro
  version: 1.0.0
  description: Implementación de Swagger con Typescript
  contact:
    name: Angel-dev
servers:
  - url: http://localhost:3000
    description: Local server

paths:
  /api/autor/{id}:
    get:
      tags:
        - Autores
      summary: Obtener autores
      description: Obtener autores
      operationId: ObtenerAutores
      parameters:
        - name: id
          in: path
          description: id autor
          required: true
          schema:
            type: integer
            format: int64
      responses:
        200:
          description: Autores
          content:
            application/json:
              schema:
                $ref: "./components/schemas/LibroSchema"
        400:
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "./components/schemas/LibroSchema"
        401:
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "./components/schemas/LibroSchema"
        403:
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "./components/schemas/LibroSchema"
        500:
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "./components/schemas/LibroSchema"
  /api/autor/create:
    post:
      tags:
        - Autor
      summary: Agregar autor
      requestBody:
        description: Agrega un nuevo registro de autor
        required: true
        content:
          application/json:
            schema:
              $ref: "./components/schemas/LibroSchema/#/myschema"
      responses:
        201:
          description: Autor creado
          content:
            application/json:
              schema:
                $ref: "./components/schemas/LibroSchema/#/myschema"
  
  
